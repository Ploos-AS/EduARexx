name: AmigaGuide
on:
  push:
    paths: ["docs/**","tools/**","tests/**","Makefile",".github/workflows/amigaguide.yml"]
  pull_request:
    paths: ["docs/**","tools/**","tests/**","Makefile"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: make test
      - run: make validate-amigaguide
      - uses: actions/upload-artifact@v4
        with:
          name: EduARexx-AmigaGuide
          path: build/EduARexx.guide
