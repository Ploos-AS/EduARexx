name: AmigaGuide
on:
  push:
    paths: ["docs/**","tools/**","tests/**","qualification/**","Makefile",".github/workflows/amigaguide.yml"]
  pull_request:
    paths: ["docs/**","tools/**","tests/**","qualification/**","Makefile"]
  workflow_dispatch:
    inputs:
      version:
        description: "AmigaGuide version"
        required: false
        default: "0.1.0"
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GUIDE_VERSION: ${{ inputs.version || '0.1.0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: make test
      - run: make validate-amigaguide VERSION="$GUIDE_VERSION"
      - name: Prepare amiga-runtime qualification payload
        run: make amiga-runtime-payload VERSION="$GUIDE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: EduARexx-amiga-runtime-payload-${{ env.GUIDE_VERSION }}
          path: build/amiga-runtime-payload/
      - name: Stage versioned artifact
        run: cp build/EduARexx.guide "build/EduARexx-${GUIDE_VERSION}.guide"
      - uses: actions/upload-artifact@v4
        with:
          name: EduARexx-AmigaGuide-${{ env.GUIDE_VERSION }}
          path: build/EduARexx-*.guide
