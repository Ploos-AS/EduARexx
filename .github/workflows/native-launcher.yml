name: Native Amiga launcher

on:
  push:
    paths:
      - 'qualification/**'
      - 'tools/package_amiga_runtime.py'
      - 'tests/test_runtime_payload.py'
      - 'Makefile'
      - '.github/workflows/native-launcher.yml'
  pull_request:
    paths:
      - 'qualification/**'
      - 'tools/package_amiga_runtime.py'
      - 'tests/test_runtime_payload.py'
      - 'Makefile'
      - '.github/workflows/native-launcher.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build-m68k:
    runs-on: ubuntu-latest
    env:
      AMIGA_DEV_IMAGE: ghcr.io/ploos-as/amiga-dev:sha-a786bb7
      AMIGA_CPU_PROFILE: '68000'
    steps:
      - uses: actions/checkout@v4

      - name: Pull pinned amiga-dev
        run: docker pull "$AMIGA_DEV_IMAGE"

      - name: Verify consumer contract
        run: docker run --rm "$AMIGA_DEV_IMAGE" amiga-check

      - name: Prepare writable native output
        run: |
          mkdir -p build
          chmod 0777 build

      - name: Build native launcher
        run: |
          docker run --rm \
            -e AMIGA_CPU_PROFILE="$AMIGA_CPU_PROFILE" \
            -v "$PWD:/workspace" \
            "$AMIGA_DEV_IMAGE" \
            amiga-build make native-launcher

      - name: Inspect Amiga target
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            "$AMIGA_DEV_IMAGE" \
            amiga-inspect build/amigaguide-launcher

      - name: Run payload contract tests
        run: python3 -m unittest tests.test_runtime_payload

      - name: Build artifact-bound native runtime payload
        env:
          EDUAREXX_SOURCE_REVISION: ${{ github.sha }}
        run: make native-runtime-payload

      - name: Verify handoff identity
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          jq -e --arg rev "$EXPECTED_REVISION" '.source_revision == $rev and .runtime_payload == "EduARexx-native-runtime-payload-m68k" and (.sha256 | length == 64) and (.launcher.sha256 | length == 64)' build/amiga-runtime-payload/eduarexx-metadata.json

      - uses: actions/upload-artifact@v4
        with:
          name: EduARexx-amigaguide-launcher-m68k
          path: build/amigaguide-launcher

      - uses: actions/upload-artifact@v4
        with:
          name: EduARexx-native-runtime-payload-m68k
          path: build/amiga-runtime-payload/
